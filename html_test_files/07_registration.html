<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
</head>
<body>
  <h1>Student Registration</h1>
  <form action="#" method="get">
    <label for="fullname">Full name:</label>
    <input id="fullname" name="fullname" type="text" required><br><br>
    <label for="reg-email">Email:</label>
    <input id="reg-email" name="email" type="email" required><br><br>
    <label for="password">Password:</label>
    <input id="password" name="password" type="password" minlength="8" required><br><br>
    <p>Gender:</p>
    <label><input type="radio" name="gender" value="male"> Male</label>
    <label><input type="radio" name="gender" value="female"> Female</label><br><br>
    <label for="department">Department:</label>
    <select id="department" name="department">
      <option value="cse">CSE</option>
      <option value="eee">EEE</option>
      <option value="bba">BBA</option>
    </select><br><br>
    <label><input type="checkbox" name="terms" required> I agree to the terms</label><br><br>
    <button type="submit">Register</button>
  </form>
</body>
</html>
