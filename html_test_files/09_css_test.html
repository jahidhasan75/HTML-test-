<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML and CSS Test</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #f2f5f9; }
    .card { max-width: 500px; padding: 24px; background: white; border-radius: 12px; }
    h1 { color: #164e9b; }
    .button { display: inline-block; padding: 10px 16px; background: #164e9b; color: white; text-decoration: none; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CSS Test Page</h1>
    <p>This page uses internal CSS to style the content.</p>
    <a class="button" href="https://developer.mozilla.org/en-US/docs/Web/HTML">Learn HTML</a>
  </div>
</body>
</html>
