<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Semantic HTML</title></head>
<body>
  <header><h1>My Website</h1><p>Learning semantic HTML</p></header>
  <nav><a href="#about">About</a> | <a href="#services">Services</a></nav>

    <aside><p>This is additional information.</p></aside>
  </main>
  <footer><p>&copy; 2026 My Website</p></footer>
</body>
</html>
