<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HTML Form</title></head>
<body>
  <h1>Contact Form</h1>
  <form action="#" method="get">
    <label for="name">Name:</label>
    <input id="name" name="name" type="text" required><br><br>
    <label for="email">Email:</label>
    <input id="email" name="email" type="email" required><br><br>
    <label for="message">Message:</label><br>
    <textarea id="message" name="message" rows="4" cols="30"></textarea><br><br>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
  </form>
</body>
</html>
